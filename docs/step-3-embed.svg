<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="20" y="24" fill="#8b949e" font-size="12" letter-spacing="1.5">TEXT IN — NUMBERS OUT</text>

  <!-- three input sentences -->
  <g font-size="11.5">
    <rect x="20" y="42" width="250" height="34" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="34" y="64" fill="#58a6ff">"The cat sat on the mat"</text>

    <rect x="20" y="88" width="250" height="34" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="34" y="110" fill="#58a6ff">"A kitten rested on the rug"</text>

    <rect x="20" y="134" width="250" height="34" rx="6" fill="none" stroke="#d29922" stroke-width="1.4"/>
    <text x="34" y="156" fill="#d29922">"The transformer uses attention"</text>
  </g>

  <!-- model -->
  <rect x="320" y="72" width="130" height="66" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="385" y="100" fill="#c9d1d9" font-size="12" text-anchor="middle">MiniLM</text>
  <text x="385" y="118" fill="#8b949e" font-size="10">mean pooling</text>

  <g stroke="#8b949e" stroke-width="1.3" marker-end="url(#a3)">
    <line x1="272" y1="59"  x2="314" y2="88"/>
    <line x1="272" y1="105" x2="314" y2="105"/>
    <line x1="272" y1="151" x2="314" y2="122"/>
  </g>

  <!-- output vector -->
  <text x="500" y="98" fill="#8b949e" font-size="11">384 numbers</text>
  <g font-size="10.5" fill="#8b949e">
    <text x="500" y="118">[ 0.130, -0.012, -0.028, ... ]</text>
  </g>
  <line x1="452" y1="105" x2="494" y2="105" stroke="#8b949e" stroke-width="1.3" marker-end="url(#a3)"/>

  <!-- ===== meaning space ===== -->
  <text x="20" y="206" fill="#8b949e" font-size="12" letter-spacing="1.5">WHERE THEY LAND</text>

  <rect x="20" y="220" width="400" height="104" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- cat cluster -->
  <circle cx="110" cy="260" r="6" fill="#58a6ff">
    <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="138" cy="276" r="6" fill="#58a6ff">
    <animate attributeName="opacity" values="0;0;1;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <line x1="110" y1="260" x2="138" y2="276" stroke="#3fb950" stroke-width="1.5">
    <animate attributeName="opacity" values="0;0;1;1" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="124" y="302" fill="#3fb950" font-size="11" text-anchor="middle">0.61</text>

  <!-- transformer point, far away -->
  <circle cx="340" cy="248" r="6" fill="#d29922">
    <animate attributeName="opacity" values="0;0;0;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <line x1="138" y1="276" x2="340" y2="248" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 4">
    <animate attributeName="opacity" values="0;0;0;1" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="243" y="252" fill="#8b949e" font-size="11" text-anchor="middle">0.00</text>

  <text x="440" y="246" fill="#c9d1d9" font-size="12">cat + kitten sit together —</text>
  <text x="440" y="264" fill="#c9d1d9" font-size="12">they share no words at all.</text>
  <text x="440" y="290" fill="#8b949e" font-size="11">The model places text by meaning,</text>
  <text x="440" y="306" fill="#8b949e" font-size="11">not by spelling.</text>
</svg>
