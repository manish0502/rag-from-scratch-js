<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

  <defs>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="20" y="24" fill="#8b949e" font-size="12" letter-spacing="1.5">ONE POINT = ONE ID + ONE VECTOR + ONE PAYLOAD</text>

  <!-- the point -->
  <rect x="20" y="42" width="330" height="190" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="36" y="64" fill="#c9d1d9" font-size="11.5">point</text>

  <!-- id -->
  <rect x="36" y="76" width="298" height="30" rx="5" fill="none" stroke="#8b949e" stroke-width="1.3"/>
  <text x="50" y="96" fill="#8b949e" font-size="11">id</text>
  <text x="120" y="96" fill="#c9d1d9" font-size="11">7</text>

  <!-- vector -->
  <rect x="36" y="112" width="298" height="42" rx="5" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="50" y="130" fill="#58a6ff" font-size="11">vector</text>
  <text x="120" y="130" fill="#8b949e" font-size="10">[-0.0807, -0.0517, 0.0229, ...]</text>
  <text x="120" y="146" fill="#58a6ff" font-size="9.5">384 numbers — search runs on this</text>

  <!-- payload -->
  <rect x="36" y="160" width="298" height="58" rx="5" fill="#d29922" fill-opacity="0.10" stroke="#d29922" stroke-width="1.4"/>
  <text x="50" y="178" fill="#d29922" font-size="11">payload</text>
  <text x="120" y="178" fill="#8b949e" font-size="9.5">text, source, pageStart, pageEnd</text>
  <text x="120" y="194" fill="#d29922" font-size="9.5">never searched —</text>
  <text x="120" y="208" fill="#d29922" font-size="9.5">returned with the result</text>

  <line x1="360" y1="136" x2="410" y2="136" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a4)"/>
  <text x="385" y="126" fill="#8b949e" font-size="10" text-anchor="middle">upsert</text>

  <!-- collection -->
  <rect x="420" y="42" width="440" height="190" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="436" y="64" fill="#3fb950" font-size="11.5">collection "papers"</text>

  <g font-size="10" fill="#8b949e">
    <text x="436" y="88">points    225</text>
    <text x="436" y="106">size      384</text>
    <text x="436" y="124">distance  Cosine</text>
  </g>

  <!-- grid of points -->
  <g fill="#30363d">
    <circle cx="640" cy="86"  r="4"/><circle cx="668" cy="86"  r="4"/><circle cx="696" cy="86" r="4"/>
    <circle cx="724" cy="86"  r="4"/><circle cx="752" cy="86"  r="4"/><circle cx="780" cy="86" r="4"/>
    <circle cx="808" cy="86"  r="4"/><circle cx="836" cy="86"  r="4"/>
    <circle cx="640" cy="112" r="4"/><circle cx="696" cy="112" r="4"/>
    <circle cx="724" cy="112" r="4"/><circle cx="752" cy="112" r="4"/><circle cx="780" cy="112" r="4"/>
    <circle cx="808" cy="112" r="4"/><circle cx="836" cy="112" r="4"/>
    <circle cx="640" cy="138" r="4"/><circle cx="668" cy="138" r="4"/><circle cx="696" cy="138" r="4"/>
    <circle cx="724" cy="138" r="4"/><circle cx="752" cy="138" r="4"/><circle cx="780" cy="138" r="4"/>
    <circle cx="808" cy="138" r="4"/><circle cx="836" cy="138" r="4"/>
  </g>

  <!-- the arriving point -->
  <circle cx="668" cy="112" r="5" fill="#58a6ff">
    <animate attributeName="opacity" values="0;0;1;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="12;5;5;5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="668" y="166" fill="#58a6ff" font-size="9.5" text-anchor="middle">id 7</text>

  <text x="436" y="196" fill="#8b949e" font-size="10">Cosine is set at creation. Leave it default and</text>
  <text x="436" y="212" fill="#8b949e" font-size="10">Qdrant uses squared Euclidean — order survives,</text>
  <text x="436" y="228" fill="#d29922" font-size="10">scores become meaningless.</text>

  <text x="20" y="262" fill="#8b949e" font-size="10.5">A normal database finds rows where a column equals a value.</text>
  <text x="20" y="278" fill="#c9d1d9" font-size="10.5">A vector database finds the points that are nearest.</text>
</svg>
