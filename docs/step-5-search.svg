<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="20" y="24" fill="#8b949e" font-size="12" letter-spacing="1.5">THE QUESTION BECOMES A VECTOR TOO</text>

  <rect x="20" y="40" width="268" height="34" rx="6" fill="none" stroke="#d29922" stroke-width="1.5"/>
  <text x="34" y="62" fill="#d29922" font-size="11.5">"how does the decoder work?"</text>

  <line x1="290" y1="57" x2="330" y2="57" stroke="#8b949e" stroke-width="1.3" marker-end="url(#a5)"/>
  <rect x="336" y="40" width="118" height="34" rx="6" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="395" y="62" fill="#c9d1d9" font-size="11.5" text-anchor="middle">MiniLM</text>

  <line x1="456" y1="57" x2="496" y2="57" stroke="#8b949e" stroke-width="1.3" marker-end="url(#a5)"/>
  <text x="504" y="62" fill="#8b949e" font-size="11">384 numbers — the same model the chunks went through</text>

  <!-- ===== the space ===== -->
  <rect x="20" y="96" width="470" height="214" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="34" y="118" fill="#8b949e" font-size="11">225 chunks, positioned by meaning</text>

  <!-- far away chunks -->
  <g fill="#30363d">
    <circle cx="70"  cy="160" r="4"/><circle cx="118" cy="290" r="4"/>
    <circle cx="430" cy="140" r="4"/><circle cx="392" cy="286" r="4"/>
    <circle cx="90"  cy="238" r="4"/><circle cx="452" cy="212" r="4"/>
    <circle cx="150" cy="146" r="4"/><circle cx="196" cy="292" r="4"/>
    <circle cx="350" cy="160" r="4"/><circle cx="60"  cy="200" r="4"/>
    <circle cx="240" cy="132" r="4"/><circle cx="300" cy="296" r="4"/>
    <circle cx="410" cy="248" r="4"/><circle cx="160" cy="272" r="4"/>
  </g>

  <!-- the three winners -->
  <circle cx="238" cy="196" r="5.5" fill="#58a6ff"/>
  <circle cx="284" cy="216" r="5.5" fill="#58a6ff"/>
  <circle cx="222" cy="240" r="5.5" fill="#58a6ff"/>

  <!-- query point -->
  <circle cx="252" cy="212" r="6.5" fill="#d29922"/>

  <!-- expanding search rings -->
  <circle cx="252" cy="212" r="10" fill="none" stroke="#d29922" stroke-width="1.5">
    <animate attributeName="r" values="8;70" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="252" cy="212" r="10" fill="none" stroke="#d29922" stroke-width="1.5">
    <animate attributeName="r" values="8;70" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- links to winners -->
  <g stroke="#58a6ff" stroke-width="1.3">
    <line x1="252" y1="212" x2="238" y2="196"/>
    <line x1="252" y1="212" x2="284" y2="216"/>
    <line x1="252" y1="212" x2="222" y2="240"/>
  </g>

  <!-- ===== results ===== -->
  <text x="520" y="118" fill="#8b949e" font-size="11">nearest three come back</text>

  <g font-size="11.5">
    <rect x="520" y="132" width="340" height="40" rx="6" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="534" y="148" fill="#58a6ff">#1   0.4296   attention.pdf  p.3   id:7</text>
    <text x="534" y="164" fill="#8b949e" font-size="10">"The Transformer - model architecture..."</text>

    <rect x="520" y="182" width="340" height="40" rx="6" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="534" y="198" fill="#58a6ff">#2   0.4289   attention.pdf  p.5   id:14</text>
    <text x="534" y="214" fill="#8b949e" font-size="10">"...each layer has a fully connected..."</text>

    <rect x="520" y="232" width="340" height="40" rx="6" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="534" y="248" fill="#58a6ff">#3   0.4072   rag.pdf        p.4   id:126</text>
    <text x="534" y="264" fill="#8b949e" font-size="10">"...the generator component..."</text>
  </g>

  <text x="520" y="296" fill="#8b949e" font-size="10.5">The word "decoder" never appears in the question's</text>
  <text x="520" y="310" fill="#8b949e" font-size="10.5">top match by keyword. Meaning found it.</text>
</svg>
