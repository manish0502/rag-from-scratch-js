<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="20" y="24" fill="#8b949e" font-size="12" letter-spacing="1.5">A PDF STORES DRAWING INSTRUCTIONS, NOT PARAGRAPHS</text>

  <!-- pdf page with scattered fragments -->
  <rect x="20" y="42" width="210" height="180" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="125" y="62" fill="#8b949e" font-size="10" text-anchor="middle">attention.pdf — page 4</text>

  <g font-size="9" fill="#8b949e">
    <rect x="36"  y="76"  width="86" height="13" rx="2" fill="#30363d"/>
    <text x="40"  y="86">Scaled Dot-</text>
    <rect x="128" y="76"  width="66" height="13" rx="2" fill="#30363d"/>
    <text x="132" y="86">Product At</text>
    <rect x="36"  y="98"  width="54" height="13" rx="2" fill="#30363d"/>
    <text x="40"  y="108">tention</text>
    <rect x="98"  y="98"  width="96" height="13" rx="2" fill="#30363d"/>
    <text x="102" y="108">Multi-Head At</text>
    <rect x="36"  y="132" width="120" height="13" rx="2" fill="#30363d"/>
    <text x="40"  y="142">Figure 2: (left) Sca</text>
    <rect x="36"  y="154" width="92" height="13" rx="2" fill="#30363d"/>
    <text x="40"  y="164">informa-</text>
    <rect x="36"  y="176" width="92" height="13" rx="2" fill="#30363d"/>
    <text x="40"  y="186">tion is com</text>
  </g>

  <text x="125" y="212" fill="#8b949e" font-size="9.5" text-anchor="middle">each box = one text item</text>

  <!-- arrow -->
  <line x1="240" y1="130" x2="292" y2="130" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="266" y="120" fill="#8b949e" font-size="10" text-anchor="middle">join</text>

  <!-- cleanup box -->
  <rect x="300" y="88" width="180" height="84" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="390" y="112" fill="#58a6ff" font-size="12" text-anchor="middle">cleanup</text>
  <text x="390" y="132" fill="#8b949e" font-size="9.5" text-anchor="middle">"informa-\ntion"</text>
  <text x="390" y="148" fill="#3fb950" font-size="9.5" text-anchor="middle">-&gt; "information"</text>
  <text x="390" y="164" fill="#8b949e" font-size="9.5" text-anchor="middle">collapse whitespace</text>

  <line x1="490" y1="130" x2="542" y2="130" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- output -->
  <rect x="550" y="70" width="310" height="120" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="564" y="92" fill="#3fb950" font-size="11">15 pages of clean text</text>

  <g font-size="9.5" fill="#8b949e">
    <text x="564" y="116">{ page: 1, text: "Provided proper..." }</text>
    <text x="564" y="134">{ page: 2, text: "The dominant seq..." }</text>
    <text x="564" y="152">{ page: 3, text: "The Transformer -..." }</text>
    <text x="564" y="170">...  6,511 words total</text>
  </g>

  <!-- travelling dot -->
  <circle r="5" fill="#3fb950">
    <animate attributeName="cx" values="125;390;700;700" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="234;234;234;234" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
